<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Real hidden title bar renderer fixture</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgb(224, 230, 238);
      }

      #toolbar {
        position: absolute;
        inset: 0 0 auto 0;
        height: 40px;
        background: rgb(18, 52, 86);
        -webkit-app-region: drag;
      }

      #action {
        position: absolute;
        left: 250px;
        top: 5px;
        width: 50px;
        height: 30px;
        padding: 0;
        border: 0;
        color: white;
        background: rgb(79, 105, 130);
        -webkit-app-region: no-drag;
      }

      main {
        position: absolute;
        top: 64px;
        left: 24px;
        font: 16px sans-serif;
        color: rgb(25, 35, 48);
      }
    </style>
  </head>
  <body>
    <header id="toolbar"><button id="action" type="button">Action</button></header>
    <main>One real renderer and native title-bar acceptance window.</main>
  </body>
</html>
