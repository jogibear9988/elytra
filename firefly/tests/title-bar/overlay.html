<!doctype html>
<meta charset="utf-8" />
<title>Loading overlay fixture</title>
<style>
  #overlay-area {
    position: absolute;
    --native-x: env(titlebar-area-x, 1px);
    left: var(--native-x);
    top: env(titlebar-area-y, 2px);
    width: calc(env(titlebar-area-width, 3px) + 1px);
    height: env(titlebar-area-height, 4px);
    margin-left: env(titlebar-area-width 0, 5px);
    margin-right: env(Titlebar-area-width, 6px);
  }
</style>
<div id="overlay-area"></div>
<script>
  function cssMatches(rect) {
    const style = getComputedStyle(document.getElementById('overlay-area'));
    return (
      parseFloat(style.left) === rect.x &&
      parseFloat(style.top) === rect.y &&
      parseFloat(style.width) === rect.width + 1 &&
      parseFloat(style.height) === rect.height &&
      style.marginLeft === '5px' &&
      style.marginRight === '6px'
    );
  }

  const overlay = navigator.windowControlsOverlay;
  const rect = overlay?.getTitlebarAreaRect();
  if (
    !overlay?.visible ||
    !(overlay instanceof EventTarget) ||
    !(rect instanceof DOMRect) ||
    rect.x <= 0 ||
    rect.height <= 0 ||
    rect.right !== 320 ||
    navigator.windowControlsOverlay !== overlay ||
    Reflect.set(navigator, 'windowControlsOverlay', null) ||
    Reflect.set(overlay, 'visible', false) ||
    !CSS.supports('env(titlebar-area-width)') ||
    !cssMatches(rect)
  ) {
    document.title =
      'FAIL overlay initial geometry ' +
      JSON.stringify({
        present: !!overlay,
        secure: isSecureContext,
        visible: overlay?.visible,
        eventTarget: overlay instanceof EventTarget,
        rect: rect?.toJSON(),
        innerWidth,
        supports: CSS.supports('env(titlebar-area-width)'),
        css: rect && cssMatches(rect)
      });
  } else {
    const child = document.createElement('iframe');
    document.body.append(child);
    const area = child.contentDocument.createElement('div');
    area.style.width = 'env(titlebar-area-width, 7px)';
    child.contentDocument.body.append(area);
    if (
      'windowControlsOverlay' in child.contentWindow.navigator ||
      child.contentWindow.getComputedStyle(area).width !== '7px'
    ) {
      document.title = 'FAIL overlay exposed to iframe';
    } else {
      const initialRight = rect.right;
      let dispatched = 0;
      overlay.addEventListener('geometrychange', (change) => {
        const changedRect = change.titlebarAreaRect;
        const liveRect = overlay.getTitlebarAreaRect();
        if (
          !change.isTrusted ||
          !change.visible ||
          !(changedRect instanceof DOMRect) ||
          changedRect.width !== liveRect.width ||
          changedRect.x !== liveRect.x
        ) {
          document.title = 'FAIL overlay change event';
          return;
        }
        dispatched++;
      });
      overlay.ongeometrychange = () => {
        if (dispatched === 0 || document.title.startsWith('FAIL')) {
          document.title = 'FAIL overlay listener ordering';
          return;
        }
        const current = overlay.getTitlebarAreaRect();
        if (!cssMatches(current)) {
          document.title = 'FAIL overlay CSS did not update';
          return;
        }
        document.title = current.right === initialRight ? 'Overlay moved' : 'Overlay resized';
      };
      document.title = 'Overlay ready';
    }
  }
</script>
