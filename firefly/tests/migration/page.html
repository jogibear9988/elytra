<!doctype html>
<meta charset="utf-8">
<title>Renderer starting</title>
<style>html {background:#14202d;color:#8fe4b0;font:24px sans-serif}body{margin:40px}</style>
<h1>Firefly migration fixture</h1><p id="status">Checking renderer isolation</p>
<script type="module">
const absent=['process','require','Buffer','__miteEnqueueTick'].every(key=>!(key in globalThis));
let rejected=false;try{await import('node:fs');}catch{rejected=true;}
const ok=absent&&rejected;
document.querySelector('#status').textContent=ok?'RENDERER_ISOLATED':'CAPABILITY_LEAK';
document.title=ok?'RENDERER_ISOLATED':'CAPABILITY_LEAK';
</script>
