<!doctype html><html><head><title>Regions loading</title>
<style id="regions">
body {margin:0} .toolbar {position:absolute;left:20px;top:10px;width:400px;height:38px;-webkit-app-region:drag}
.button {position:absolute;left:300px;top:10px;width:100px;height:38px;app-region:no-drag}
@media (min-width: 500px) {.modern {position:absolute;left:20px;top:80px;width:200px;height:30px;app-region:drag}}
</style></head><body><div class="toolbar">Drag</div><button class="button">Click</button><div class="modern">Modern</div>
<script>
(async()=>{
 try{
  for(let i=0;i<100&&typeof __fireflyRegionSnapshot!=='function';i++)await new Promise(r=>setTimeout(r,50));
  const snapshot=()=>JSON.parse(__fireflyRegionSnapshot());
  let regions=snapshot();
  const has=(x,y,width,height,drag)=>regions.some(r=>JSON.stringify(r)===JSON.stringify([x,y,width,height,drag]));
  if(!has(20,10,400,38,true)||!has(300,10,100,38,false)||!has(20,80,200,30,true))throw Error('CSS alias/media/geometry: '+JSON.stringify(regions));
  document.getElementById('regions').textContent='.toolbar{position:absolute;left:40px;top:10px;width:300px;height:38px;app-region:drag}';
  regions=snapshot();if(!has(40,10,300,38,true)||regions.length!==1)throw Error('dynamic style: '+JSON.stringify(regions));
  document.getElementById('regions').remove();regions=snapshot();if(regions.length)throw Error('removed regions retained');
  if(typeof require!=='undefined'||typeof process!=='undefined')throw Error('privilege leak');
  document.title='REGIONS_CSS_LAYOUT_OK';
 }catch(error){document.title='REGIONS_FAILED '+error;}
})();
</script></body></html>
