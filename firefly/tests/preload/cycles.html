<!doctype html>
<script>
window.rootProof=window.name==='FIREFLY_WORLD_READY:'+location.href &&
 typeof __fireflyIsolatedMarker==='undefined' && !({}).__fireflyWorldOnly;
</script>
<meta charset="utf-8">
<body><p id="status">WAITING_FOR_CYCLES</p>
<script>
let completed=0, valid=rootProof;
function next() {
 const frame=document.createElement('iframe');
 frame.onload=()=>{
  if(frame.contentWindow.location.href!=='about:srcdoc')return;
  valid=valid&&frame.contentWindow.frameProof;
  frame.remove();completed++;
  if(completed===70) {
   document.querySelector('#status').textContent=valid?'CYCLES_WORLD_OK':'CYCLES_WORLD_MISSING';
   if(valid)setTimeout(()=>window.close(),100);
  } else setTimeout(next,0);
 };
 frame.srcdoc=`<!doctype html><script>
window.frameProof=window.name==='FIREFLY_WORLD_READY:'+location.href &&
 typeof __fireflyIsolatedMarker==='undefined' && !({}).__fireflyWorldOnly;
<\/script>`;
 document.body.append(frame);
}
next();
</script>
