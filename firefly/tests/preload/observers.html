<!doctype html>
<meta charset="utf-8">
<body><p id="status">WAITING_FOR_OBSERVERS</p>
<script>
let getterHits=0,pageCalls=0;
Object.defineProperty(Array.prototype,'observerTrap',{get(){getterHits++;return true},configurable:true});
MutationObserver.prototype.observerPoison=true;
MutationRecord.prototype.observerPoison=true;
const pageObserver=new MutationObserver(()=>pageCalls++);
pageObserver.observe(document.documentElement,{attributes:true,attributeFilter:['data-observer-input']});
const monitor=new MutationObserver(()=>{
 monitor.disconnect();
 const first=document.documentElement.getAttribute('data-source-observer');
 document.documentElement.setAttribute('data-observer-input','pending');
 let denied=false;
 try{__fireflyFunctionProbe({mode:'detach-world'})}catch(e){denied=e instanceof TypeError}
 document.documentElement.setAttribute('data-observer-input','after-detach');
 setTimeout(()=>{
  const ok=denied && first==='1:true' &&
   document.documentElement.getAttribute('data-source-observer')===first && pageCalls>=2 && getterHits===0;
  pageObserver.disconnect();
  delete Array.prototype.observerTrap;
  delete MutationObserver.prototype.observerPoison;
  delete MutationRecord.prototype.observerPoison;
  document.querySelector('#status').textContent=ok?'OBSERVER_WORLD_OK':'OBSERVER_WORLD_MISSING';
  if(ok)setTimeout(()=>window.close(),100);
 },200);
});
monitor.observe(document.documentElement,{attributes:true,attributeFilter:['data-source-observer']});
__fireflyFunctionProbe({mode:'start-observer'});
document.documentElement.setAttribute('data-observer-input','first');
</script>
