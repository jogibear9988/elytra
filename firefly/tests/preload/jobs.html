<!doctype html>
<meta charset="utf-8" />
<body>
  <p id="status">WAITING_FOR_JOBS</p>
  <iframe id="frame"></iframe>
  <script>
    const frame = document.querySelector('#frame');
    frame.onload = () => {
      if (frame.contentWindow.location.href !== 'about:srcdoc') return;
      const childDocument = frame.contentDocument;
      // The native source function queues jobs while this parent JS turn is still
      // running. Remove its document before the next microtask checkpoint/sweep.
      const argument = new frame.contentWindow.Object();
      argument.mode = 'queue-jobs';
      const scheduled = frame.contentWindow.__fireflyFunctionProbe(argument);
      frame.remove();
      Promise.resolve().then(() => {
        setTimeout(() => {
          const ok =
            scheduled && childDocument.documentElement.getAttribute('data-source-job') === null;
          document.querySelector('#status').textContent = ok
            ? 'WORLD_JOBS_OK'
            : 'WORLD_JOBS_MISSING';
          if (ok) setTimeout(() => window.close(), 100);
        }, 50);
      });
    };
    frame.srcdoc = '<!doctype html><p>job guard child</p>';
  </script>
</body>
