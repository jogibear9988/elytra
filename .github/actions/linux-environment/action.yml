name: Native Linux environment
description: Install the pinned Linux compiler/CMake/Rust toolchain and optional renderer prerequisites
inputs:
  renderer:
    description: Install the native graphics and window-system development headers
    default: 'false'
runs:
  using: composite
  steps:
    - name: Native compiler and build prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf autoconf-archive automake build-essential curl gnupg libtool ninja-build pkg-config unzip zip
        curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
        gpg --batch --yes --dearmor --output "$RUNNER_TEMP/llvm.gpg" "$RUNNER_TEMP/llvm.asc"
        sudo install -m 644 "$RUNNER_TEMP/llvm.gpg" /usr/share/keyrings/elytra-llvm.gpg
        echo 'deb [signed-by=/usr/share/keyrings/elytra-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/elytra-llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-22 lld-22
        python -m pip install --only-binary=:all: cmake==4.2.0
        clang-22 --version
        cmake --version
    - name: Renderer system prerequisites
      if: inputs.renderer == 'true'
      shell: bash
      run: |
        # Qt itself comes from the upstream vcpkg version pin, not Ubuntu's older Qt.
        sudo apt-get install -y bison flex fonts-liberation2 glslang-tools libdrm-dev libegl1-mesa-dev libfontconfig1-dev libgl1-mesa-dev libglib2.0-dev libglu1-mesa-dev libncurses-dev libpulse-dev libwayland-dev libx11-xcb-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev '^libxcb.*-dev' mesa-vulkan-drivers nasm
        sudo apt-get install -y openbox xauth xvfb
    - name: Pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
        rustup default 1.98.0
