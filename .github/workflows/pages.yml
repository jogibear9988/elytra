name: Project website
on:
  push:
    branches: [main, codex/mite-firefly]
    paths: ['site/**', 'docs/**', 'README.md', 'tooling/site/**', 'tooling/check_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'README.md', 'tooling/site/**', 'tooling/check_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: tooling/site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/site
      - run: node tooling/site/build.mjs
      - run: python3 tooling/check_site.py build/site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
