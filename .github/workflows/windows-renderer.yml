name: Experimental native Windows renderer
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-renderer.yml'
      - '.github/actions/windows-environment/**'
      - 'firefly/**'
      - 'mite/cmake/**'
      - 'mite/runtime/adapters/**'
      - 'tooling/build_renderer.py'
      - 'tooling/bootstrap.py'
      - 'tooling/check_upstream.py'
      - 'tooling/check_checkout_paths.py'
      - 'tooling/tests/test_renderer.py'
      - 'tooling/tests/test_window.py'
      - 'tooling/tests/_windows_window.py'
      - 'tooling/tests/_windows_processes.py'
      - 'tooling/tests/_windows_renderer.py'
      - 'tooling/tests/test_windows_processes.py'
      - 'tooling/tests/test_wire_process.py'
      - 'tooling/tests/_support.py'
      - 'vendor/ladybird'
      - 'vendor/ladybird.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-renderer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer:
    name: Experimental LibWeb headless / native Windows x64
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      CC: clang-cl
      CXX: clang-cl
      VCPKG_MAX_CONCURRENCY: '3'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/windows-environment
      - name: Native process observer component and unsupported-host guard
        run: |
          python tooling/tests/test_windows_processes.py --check-guard
          if ($LASTEXITCODE) { throw 'Native observer guard failed' }
          python tooling/tests/test_windows_processes.py
          if ($LASTEXITCODE) { throw 'Native Windows observer component failed' }
      - name: Pinned native CMake and Rust
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: cmake==4.2.0
          if ($LASTEXITCODE) { throw 'Pinned CMake installation failed' }
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { throw 'Pinned Rust installation failed' }
          rustup default 1.98.0
          if ($LASTEXITCODE) { throw 'Pinned Rust selection failed' }
          cmake --version
          clang-cl --version
      - name: Check native paths and prepare dependency cache
        shell: pwsh
        run: |
          python tooling/check_checkout_paths.py
          if ($LASTEXITCODE) { throw 'Windows checkout paths failed' }
          New-Item -ItemType Directory -Force build/vcpkg-cache, build/renderer-cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE/build/vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dependencies
        with:
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-renderer-clang-${{ hashFiles('vendor/ladybird.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-renderer-clang-${{ hashFiles('vendor/ladybird.json') }}-
            windows-renderer-clang-
            windows-x64-clang-release-
      - name: Bootstrap pinned native dependencies
        run: python tooling/bootstrap.py
      - name: Configure the actual pinned renderer and owned diagnostic targets
        shell: pwsh
        run: |
          python tooling/build_renderer.py --build-dir build/windows-renderer --target firefly-renderer-probe --configure-only --jobs 3 2>&1 | Tee-Object build/windows-renderer-configure.log
          if ($LASTEXITCODE) { throw 'Native renderer configuration failed' }
      - name: Compile LibWeb, renderer helpers and native isolation/wire probes
        shell: pwsh
        run: |
          cmake --build build/windows-renderer --target firefly-renderer-probe firefly-isolation-probe firefly-wire-process-probe --parallel 3 2>&1 | Tee-Object build/windows-renderer-build.log
          if ($LASTEXITCODE) { throw 'Native renderer compilation failed' }
      - name: Actual LibJS DOM, absent Node privileges and compositor PNG
        shell: pwsh
        run: |
          python tooling/tests/test_renderer.py --probe build/windows-renderer/bin/firefly-renderer-probe.exe --artifacts-dir build/windows-renderer-artifacts 2>&1 | Tee-Object build/windows-renderer-acceptance.log
          if ($LASTEXITCODE) { throw 'Native headless renderer acceptance failed' }
          # test_renderer requires native helper ownership and retains an UNVERIFIED containment label.
          # This component gate must never be presented as complete desktop acceptance.
      - name: Actual realm isolation and separate-process wire data
        shell: pwsh
        run: |
          cmake --build build/windows-renderer --target check-firefly-isolation --parallel 3 2>&1 | Tee-Object build/windows-renderer-isolation.log
          if ($LASTEXITCODE) { throw 'Native realm/wire acceptance failed' }
      - name: Compile experimental native Qt DirectX window adapter
        shell: pwsh
        run: |
          cmake --build build/windows-renderer --target firefly-window-probe --parallel 3 2>&1 | Tee-Object build/windows-renderer-window-build.log
          if ($LASTEXITCODE) { throw 'Native Windows window compilation failed' }
      - name: Native windows-platform input, painted capture and owned renderer crash
        shell: pwsh
        run: |
          python tooling/tests/test_window.py --probe build/windows-renderer/bin/firefly-window-probe.exe 2>&1 | Tee-Object build/windows-renderer-window-acceptance.log
          if ($LASTEXITCODE) { throw 'Native Windows window acceptance failed' }
      - name: Record unmodified upstream
        if: always()
        run: python tooling/check_upstream.py
      - name: Preserve completed native dependency packages
        if: always() && steps.dependencies.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve native Windows renderer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-renderer-experimental-diagnostics
          path: |
            build/windows-renderer*.log
            build/windows-renderer-artifacts
            build/renderer-artifacts/window.png
            build/windows-renderer/CMakeCache.txt
            build/windows-renderer/CMakeFiles/CMakeConfigureLog.yaml
            build/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
