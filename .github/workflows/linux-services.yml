name: Native Linux OS services
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/linux-services.yml'
      - '.github/actions/linux-environment/**'
      - 'firefly/native/CMakeLists.txt'
      - 'firefly/native/clipboard/**'
      - 'firefly/native/window/**'
      - 'firefly/native/qt/Requirements.cmake'
      - 'tooling/renderer_dependencies.py'
      - 'tooling/firefly_dependencies.py'
      - 'tooling/upstream_dependencies.py'
      - 'tooling/bootstrap.py'
      - 'tooling/check_upstream.py'
      - 'tooling/tests/test_x11_clipboard.py'
      - 'tooling/tests/test_x11_geometry.py'
      - 'tooling/tests/_x11.py'
      - 'vendor/ladybird'
      - 'vendor/ladybird.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-native-services-${{ github.ref }}
  cancel-in-progress: false
jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang-22
      CXX: clang++-22
      LDFLAGS: -fuse-ld=/usr/bin/ld.lld-22
      VCPKG_MAX_CONCURRENCY: '3'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/linux-environment
        with:
          renderer: 'true'
      - name: Independent X11 geometry tools
        run: sudo apt-get install -y x11-utils
      - name: Prepare shared native dependency cache
        run: |
          mkdir -p build/vcpkg-cache build/renderer-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/build/vcpkg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dependencies
        with:
          # Match renderer cache paths/version so its exact Qt bottles can be reused.
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-services-clang22-${{ hashFiles('vendor/ladybird.json', 'tooling/renderer_dependencies.py') }}-${{ github.run_id }}
          restore-keys: |
            linux-services-clang22-${{ hashFiles('vendor/ladybird.json', 'tooling/renderer_dependencies.py') }}-
            linux-services-clang22-
            linux-renderer-clang22-
      - name: Bootstrap pinned native dependencies
        run: python tooling/bootstrap.py
      - name: Configure and compile standalone native services
        run: |
          set -o pipefail
          python tooling/renderer_dependencies.py --services --prepare build/linux-native-services/manifest
          cmake -S firefly/native -B build/linux-native-services -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/build/linux-native-services/manifest" 2>&1 | tee build/linux-native-services-configure.log
          cmake --build build/linux-native-services --parallel 3 2>&1 | tee build/linux-native-services-build.log
      - name: Actual native protocol, guards, clipboard peers and independent X11 window geometry
        env:
          FIREFLY_TEST_ISOLATED_X11: '1'
          QT_QPA_PLATFORM: xcb
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' ctest --test-dir build/linux-native-services --output-on-failure 2>&1 | tee build/linux-native-services-acceptance.log
      - name: Preserve completed native dependencies
        if: always() && steps.dependencies.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify unmodified upstream
        if: always()
        run: python tooling/check_upstream.py
      - name: Preserve native service evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-native-services-diagnostics
          path: |
            build/linux-native-services*.log
            build/linux-native-services/CMakeCache.txt
            build/linux-native-services/CMakeFiles/CMakeConfigureLog.yaml
            build/linux-native-services/Testing/Temporary/LastTest.log
            build/linux-native-services/manifest
            build/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
