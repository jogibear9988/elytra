name: Native Windows package components
on:
  push:
    branches: [master, 'codex/ladybird-update-*', 'codex/windows-package-*']
    paths:
      - '.github/workflows/windows-package.yml'
      - '.github/actions/windows-environment/setup.ps1'
      - 'firefly/packaging/LauncherWindows.cpp'
      - 'tooling/tests/test_windows_launcher.py'
      - 'tooling/native_package/pe.py'
      - 'tooling/native_package/payload.py'
      - 'tooling/native_package/runtime_options.py'
      - 'tooling/native_package/windows_app.py'
      - 'tooling/package_windows.py'
      - 'tooling/build_code_oss.py'
      - 'tooling/code_oss/compile.mjs'
      - 'tooling/tests/test_code_oss_sample.py'
      - 'tooling/windows-sandbox/stage.py'
      - 'tooling/tests/test_windows_helper_source.py'
      - 'tooling/npm_payload.py'
      - 'tooling/tests/test_windows_pe_package.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    name: Relocatable Windows launcher
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Native Visual Studio compiler
        shell: pwsh
        run: '& ./.github/actions/windows-environment/setup.ps1'
      - name: Compile and launch the relocated native fixture
        run: python tooling/tests/test_windows_launcher.py
      - name: Assemble and run the relocated PE application fixture
        run: python tooling/tests/test_windows_pe_package.py
