name: Native Linux renderer acceptance
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/linux-renderer.yml'
      - '.github/actions/linux-environment/**'
      - 'firefly/**'
      - 'mite/cmake/**'
      - 'mite/runtime/**'
      - 'mite/modules/**'
      - 'mite/cli/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'tooling/package_linux.py'
      - 'tooling/build_designer.py'
      - 'tooling/bundle_designer.mjs'
      - 'tooling/npm_payload.py'
      - 'examples/web-component-designer/**'
      - 'tooling/build_renderer.py'
      - 'tooling/compiler_cache.py'
      - 'tooling/compiler-cache.conf'
      - 'tooling/*dependencies.py'
      - 'tooling/check_*.py'
      - 'tooling/stage_renderer_resources.py'
      - 'tooling/tests/**'
      - 'tooling/native_package/**'
      - 'vendor/ladybird'
      - 'vendor/ladybird.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-renderer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer:
    name: LibWeb and isolated helper / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: clang-22
      CXX: clang++-22
      LDFLAGS: -fuse-ld=/usr/bin/ld.lld-22
      VCPKG_MAX_CONCURRENCY: '3'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      LIBGL_ALWAYS_SOFTWARE: '1'
      CCACHE_DIR: ${{ github.workspace }}/build/compiler-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/tooling/compiler-cache.conf
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Pinned preload authoring tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/runtime-js
      - uses: ./.github/actions/linux-environment
        with:
          renderer: 'true'
      - name: Native ELF dependency closure and relocation fixture
        run: |
          sudo apt-get install -y patchelf gdb x11-xserver-utils
          patchelf --version
          python tooling/tests/test_linux_cpu.py
          python tooling/tests/test_elf_package.py
      - name: Record CPU and enable bounded native crash diagnostics
        run: |
          lscpu | tee build-linux-cpu.log
          mkdir -p build/linux-cores
          mv build-linux-cpu.log build/linux-renderer-cpu.log
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/build/linux-cores/core.%e.%p"
      - name: Prepare dependency cache
        run: |
          mkdir -p build/vcpkg-cache build/renderer-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/build/vcpkg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dependencies
        with:
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-renderer-clang22-${{ hashFiles('vendor/ladybird.json', 'tooling/renderer_dependencies.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-renderer-clang22-${{ hashFiles('vendor/ladybird.json', 'tooling/renderer_dependencies.py') }}-
            linux-renderer-clang22-
            linux-noble-clang22-
      - name: Bootstrap pinned native dependencies
        run: python tooling/bootstrap.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compiler-cache
        with:
          path: build/compiler-cache
          key: linux-renderer-objects-clang22-${{ hashFiles('vendor/ladybird.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-renderer-objects-clang22-${{ hashFiles('vendor/ladybird.json') }}-
            linux-renderer-objects-clang22-
      - name: Actual compiler cache hits and invalidation gates
        run: |
          ccache --version
          python tooling/tests/test_compiler_cache.py
      - name: Native ELF private-codec relocation and export regression
        run: python tooling/tests/test_linux_ffmpeg_link.py
      - name: Configure and compile native renderer and owned helper
        run: |
          set -o pipefail
          python tooling/build_renderer.py --build-dir build/linux-renderer --target firefly-preload-probe --configure-only --ccache --baseline-cpu --jobs 3 2>&1 | tee build/linux-renderer-build.log
          cmake --build build/linux-renderer --target firefly-clipboard-protocol-probe --parallel 3 2>&1 | tee build/linux-renderer-clipboard-build.log
          build/linux-renderer/bin/firefly-clipboard-protocol-probe 2>&1 | tee build/linux-renderer-clipboard-protocol.log
          cmake --build build/linux-renderer --target firefly-x11-clipboard-probe --parallel 3 2>&1 | tee build/linux-renderer-x11-clipboard-build.log
          FIREFLY_TEST_ISOLATED_X11=1 QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1280x800x24' python tooling/tests/test_x11_clipboard.py --probe build/linux-renderer/bin/firefly-x11-clipboard-probe 2>&1 | tee build/linux-renderer-x11-clipboard.log
          cmake --build build/linux-renderer --target firefly-x11-geometry-probe --parallel 3 2>&1 | tee build/linux-renderer-x11-geometry-build.log
          FIREFLY_TEST_ISOLATED_X11=1 QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1280x800x24' python tooling/tests/test_x11_geometry.py --probe build/linux-renderer/bin/firefly-x11-geometry-probe 2>&1 | tee build/linux-renderer-x11-geometry.log
          cmake --build build/linux-renderer --target firefly-preload-probe --parallel 3 2>&1 | tee build/linux-renderer-helper-build.log
          cmake --build build/linux-renderer --target firefly-renderer-probe firefly-isolation-probe firefly-wire-process-probe --parallel 3 2>&1 | tee build/linux-renderer-probes-build.log
          cmake --build build/linux-renderer --target firefly-window-probe --parallel 3 2>&1 | tee build/linux-renderer-window-build.log
      - name: Verify dependency adapter and unmodified upstream
        run: |
          python tooling/renderer_dependencies.py --check build/linux-renderer/renderer-manifest
          python tooling/check_upstream.py
          ldd build/linux-renderer/bin/firefly-renderer-probe
          ldd build/linux-renderer/firefly-helper/bin/WebContent
      - name: Actual LibWeb DOM, screenshot, process separation and Linux sandbox state
        run: |
          set -o pipefail
          python tooling/tests/test_renderer.py --probe build/linux-renderer/bin/firefly-renderer-probe --artifacts-dir build/linux-renderer-artifacts 2>&1 | tee build/linux-renderer-acceptance.log
      - name: Native realm isolation and cross-process wire gates
        run: |
          set -o pipefail
          cmake --build build/linux-renderer --target check-firefly-isolation --parallel 3 2>&1 | tee build/linux-renderer-isolation.log
      - name: Actual owned helper DOM, screenshot and kernel sandbox state
        run: |
          set -o pipefail
          python tooling/tests/test_renderer.py --probe build/linux-renderer/bin/firefly-preload-probe --artifacts-dir build/linux-renderer-helper-artifacts 2>&1 | tee build/linux-renderer-owned-acceptance.log
      - name: Actual owned renderer helper and callback lifetime gates
        run: |
          set -o pipefail
          python tooling/tests/test_renderer_helper.py --probe build/linux-renderer/bin/firefly-preload-probe --control build/linux-renderer/bin/firefly-renderer-probe 2>&1 | tee build/linux-renderer-helper.log
      - name: Trusted native byte handoff to actual headless WebContent
        run: |
          set -o pipefail
          cmake --build build/linux-renderer --target check-firefly-byte-renderer --parallel 3 2>&1 | tee build/linux-renderer-byte-handoff.log
      - name: Native X11 window input, rendered capture and renderer crash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' bash -euo pipefail -c '
            openbox > build/linux-renderer-window-manager.log 2>&1 &
            manager=$!
            trap "kill $manager 2>/dev/null || true" EXIT
            python tooling/tests/test_window.py --probe build/linux-renderer/bin/firefly-window-probe
          ' 2>&1 | tee build/linux-renderer-window.log
      # All probe gates above remain required; only then enable the actual Mite-driven desktop target.
      - name: Compile experimental Mite-driven native X11 runtime
        run: |
          set -o pipefail
          python tooling/build_renderer.py --build-dir build/linux-renderer --target firefly --configure-only --ccache --baseline-cpu --jobs 3 2>&1 | tee build/linux-renderer-runtime-configure.log
          cmake --build build/linux-renderer --target firefly firefly-linux-environment-probe --parallel 3 2>&1 | tee build/linux-renderer-runtime-build.log
          python tooling/firefly_dependencies.py --check build/linux-renderer/firefly-manifest --linux
          ldd build/linux-renderer/bin/firefly
          ldd build/linux-renderer/firefly-runtime/bin/WebContent
      - name: Verify real startup guards without a display
        run: |
          build/linux-renderer/bin/firefly-linux-environment-probe
          python tooling/tests/test_linux_runtime.py --firefly build/linux-renderer/bin/firefly --check-guard
      - name: Actual Mite app, LibWeb/preload/IPC, clipboard and live renderer kernel state
        env:
          QT_QPA_PLATFORM: xcb
          FIREFLY_TEST_ISOLATED_X11: '1'
        run: |
          set -o pipefail
          ulimit -c 524288
          xvfb-run -a -s '-screen 0 1280x800x24' python tooling/tests/test_linux_runtime.py --firefly build/linux-renderer/bin/firefly 2>&1 | tee build/linux-renderer-runtime-acceptance.log
      - name: Actual opt-in Electron import alias and isolated preload policy
        env:
          QT_QPA_PLATFORM: xcb
          FIREFLY_TEST_ISOLATED_X11: '1'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' python tooling/tests/test_electron_compat.py --firefly build/linux-renderer/bin/firefly 2>&1 | tee build/linux-renderer-electron-compat.log
      - name: Compile separate standalone Release Mite for package validation
        run: |
          set -o pipefail
          cmake -S . -B build/linux-package-mite -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_CI_BASELINE_CPU=ON -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=/usr/bin/ld.lld-22 -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee build/linux-renderer-package-mite-configure.log
          python tooling/check_linux_cpu.py --build build/linux-package-mite
          cmake --build build/linux-package-mite --target mite --parallel 3 2>&1 | tee build/linux-renderer-package-mite-build.log
          ldd build/linux-package-mite/bin/mite | tee build/linux-renderer-package-mite-linkage.log
          env -u DISPLAY -u QT_QPA_PLATFORM build/linux-package-mite/bin/mite examples/mite-cli/hello.mjs world
      - name: Actual stripped archive, extracted launcher, live ELF provenance and app acceptance
        env:
          QT_QPA_PLATFORM: xcb
          FIREFLY_TEST_ISOLATED_X11: '1'
        run: |
          set -o pipefail
          ulimit -c 524288
          xvfb-run -a -s '-screen 0 1280x800x24' python tooling/tests/test_linux_runtime.py --firefly build/linux-renderer/bin/firefly --package --mite-build build/linux-package-mite --artifacts-dir build/linux-package-artifacts 2>&1 | tee build/linux-renderer-package-acceptance.log
      - name: Compile and bundle the pinned Designer production sample
        run: |
          set -o pipefail
          python tooling/build_designer.py --dependencies production --bundle 2>&1 | tee build/linux-renderer-designer-build.log
      - name: Actual extracted Designer archive, editing, Monaco and native HTML controls
        env:
          QT_QPA_PLATFORM: xcb
          FIREFLY_TEST_ISOLATED_X11: '1'
        run: |
          set -o pipefail
          snapshot="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          xvfb-run -a -s '-screen 0 1280x900x24' python tooling/tests/test_linux_designer_package.py --build build/linux-renderer --mite-build build/linux-package-mite --app build/designer-app --version "$snapshot" 2>&1 | tee build/linux-renderer-designer-package.log
      - name: Preserve accepted experimental Designer Linux candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-designer-package-candidate
          path: build/linux-designer-packages
          if-no-files-found: error
      - name: Diagnose native crash instruction and stack without rerunning acceptance
        if: failure()
        run: |
          for core in build/linux-cores/core.*; do
            [ -f "$core" ] || continue
            name=$(basename "$core")
            name=${name#core.}
            name=${name%.*}
            case "$name" in
              firefly) executable=build/linux-renderer/bin/firefly ;;
              WebContent) executable=build/linux-renderer/firefly-runtime/bin/WebContent ;;
              *) executable="build/linux-renderer/bin/$name" ;;
            esac
            if [ -f "$executable" ]; then
              timeout 30s gdb --batch -q -iex 'set auto-load off' -ex 'info registers' -ex 'x/12i $pc' -ex 'thread apply all bt' "$executable" -c "$core" >> build/linux-renderer-native-crash.log 2>&1 || true
            fi
          done
      - name: Record final upstream integrity
        if: always()
        run: python tooling/check_upstream.py
      - name: Record actual compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: ccache --show-stats 2>&1 | tee build/linux-renderer-ccache.log
      - name: Preserve completed compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve completed dependency packages
        if: always() && steps.dependencies.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/vcpkg-cache
            build/renderer-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve native renderer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-renderer-diagnostics
          path: |
            build/linux-renderer*.log
            build/linux-renderer-artifacts
            build/linux-renderer-helper-artifacts
            build/linux-runtime-artifacts
            build/linux-package-artifacts
            build/linux-designer-package-artifacts
            build/designer-last-ui.log
            build/linux-package-mite/CMakeCache.txt
            build/renderer-artifacts/window.png
            build/linux-renderer/CMakeCache.txt
            build/linux-renderer/CMakeFiles/CMakeConfigureLog.yaml
            build/linux-renderer/renderer-manifest
            build/linux-renderer/firefly-manifest
            build/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
