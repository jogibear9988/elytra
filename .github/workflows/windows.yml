name: Native Windows development
on:
  push:
    branches: [master]
    paths:
      [
        '.github/workflows/windows.yml',
        '.github/actions/windows-environment/**',
        'CMakeLists.txt',
        'vcpkg.json',
        'vendor/ladybird',
        'vendor/ladybird.json',
        'mite/**',
        'tooling/bootstrap.py',
        'tooling/check_checkout_paths.py',
        'tooling/tests/**'
      ]
  pull_request:
    paths:
      [
        '.github/workflows/windows.yml',
        '.github/actions/windows-environment/**',
        'CMakeLists.txt',
        'vcpkg.json',
        'vendor/ladybird',
        'vendor/ladybird.json',
        'mite/**',
        'tooling/bootstrap.py',
        'tooling/check_checkout_paths.py',
        'tooling/tests/**'
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkout-paths:
    name: Portable source checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tooling/check_checkout_paths.py
      - run: python tooling/tests/test_checkout_paths.py
  mite:
    needs: checkout-paths
    name: Mite / native clang-cl x64
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_MAX_CONCURRENCY: '3'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: ./.github/actions/windows-environment
      - name: Pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { throw 'Rust toolchain installation failed' }
          rustup default 1.98.0
          if ($LASTEXITCODE) { throw 'Rust toolchain selection failed' }
      - name: Prepare local dependency cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dependency-cache
        with:
          path: build/vcpkg-cache
          key: windows-x64-clang-release-${{ hashFiles('vcpkg.json', 'vendor/ladybird.json') }}
          restore-keys: windows-x64-clang-release-
      - name: Bootstrap pinned native dependencies
        run: python tooling/bootstrap.py
      - name: Configure standalone Mite
        run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_EXE_LINKER_FLAGS=/DEBUG -DLADYBIRD_GENERATE_SYMBOL_FILES=ON -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/build/vcpkg/scripts/buildsystems/vcpkg.cmake"
        shell: pwsh
      - name: Compile Mite and native test hosts
        id: compile
        run: cmake --build build/windows --target mite --parallel 3
      - name: Diagnose native VM startup
        if: always() && steps.compile.outcome == 'success'
        run: python tooling/diagnose_windows_startup.py --probe build/windows/bin/mite-startup-probe.exe --output build/windows/native-startup.log
      - name: Install locked npm test fixtures
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/npm-fixtures
      - name: Run all enabled runtime suites
        run: ctest --test-dir build/windows --output-on-failure --output-junit windows-ctest.xml
      - name: Record independent Mite TLS and HTTPS acceptance if the Node reference fails
        if: always() && steps.compile.outcome == 'success'
        run: |
          python tooling/tests/test_tls.py --mite build/windows/bin/mite.exe --host build/windows/bin/mite-embedded-host.exe --native-only *> build/windows/tls-native.log
          $tlsResult = $LASTEXITCODE
          Get-Content build/windows/tls-native.log
          python tooling/tests/test_https.py --mite build/windows/bin/mite.exe --host build/windows/bin/mite-embedded-host.exe --native-only *> build/windows/https-native.log
          $httpsResult = $LASTEXITCODE
          Get-Content build/windows/https-native.log
          if ($tlsResult -ne 0) { exit $tlsResult }
          exit $httpsResult
        shell: pwsh
      - name: Record upstream integrity after native build
        if: always()
        run: python tooling/check_upstream.py
      - name: Preserve completed dependency packages even after a compile failure
        if: always() && steps.dependency-cache.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/vcpkg-cache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-native-diagnostics
          path: |
            build/windows/CMakeCache.txt
            build/windows/CMakeFiles/CMakeConfigureLog.yaml
            build/windows/Testing/Temporary/LastTest.log
            build/windows/windows-ctest.xml
            build/windows/native-startup.log
            build/windows/tls-native.log
            build/windows/https-native.log
            build/windows/bin/mite-startup-probe.pdb
            build/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
